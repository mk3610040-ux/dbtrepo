models:
  - name: t_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: t_orders
    columns:
      - name: status
        tests:
          - accepted_values:
              values: ['returned', 'shipped', 'completed', 'return_pending', 'placed']
      - name: customer_id
        tests:
          - relationships:
              to: ref('t_customers')
              field: customer_id
